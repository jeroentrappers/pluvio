[project]
name = "pluvio-research"
version = "0.1.0"
description = "Verification + horizon-extension research for the Pluvio precipitation app."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "h5py>=3.11",
    "owslib>=0.31",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "pyproj>=3.6",
    "zstandard>=0.22",
    "zarr>=3.0",
    "rasterio>=1.4",
    "copernicusmarine>=2.4.1",
    # Classical optical-flow nowcast — the product baseline (model/classical.py)
    # AND the real verification reference. The code degrades to a built-in
    # phase-correlation fallback if this is absent, but production/eval want it.
    "pysteps>=1.10",
    # NWP context (ECMWF AIFS deterministic + ensemble) and GRIB decoding.
    "ecmwf-opendata>=0.3",
    "cfgrib>=0.9",
    "eccodes>=2.38",
    "xarray>=2024.6",
    # EUMETSAT MTG (Lightning Imager + FCI L2) collection + reprojection.
    "eumdac>=3.0",
    "satpy>=0.49",
    "pyresample>=1.28",
    "netcdf4>=1.6",
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
