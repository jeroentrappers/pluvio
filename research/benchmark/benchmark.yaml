# Frozen benchmark definition for research/tools/benchmark.py.
#
# Changing the numbers below changes what "beats the benchmark" means, so
# treat edits here like a protocol change: bump `name`/`version` and note why
# in the commit message rather than silently tightening or loosening it.

name: pluvio-nowcast-benchmark
version: 1

# Validation window: issue-times in [start, end) are eligible samples.
#
# The start time is NOT arbitrary: it must sit at or after the store's own
# train/val split (issue_time_split(store, val_frac_split)), or samples in
# this window would score models against data they were trained on. The v3
# store's split (val_frac_split=0.2) currently lands at 2026-04-02T21:30Z, so
# the start below is that boundary, not midnight. run_benchmark() recomputes
# the split against whatever store you pass and REFUSES to run if this start
# precedes it — bump this value (or val_frac_split) rather than reaching for
# allow_train_overlap.
val_window:
  start: "2026-04-02T21:30:00"
  end: "2026-08-31"

# Fraction of issue-times held out as validation by issue_time_split(); must
# match (or be looser than) whatever split the store's own training run used.
val_frac_split: 0.2

# Escape hatch for a store with no meaningful temporal train/val split (e.g.
# a from-scratch eval store that was never used for training). Never set this
# to silence the guard against the actual training store.
allow_train_overlap: false

# Curated event days, evaluated in addition to (not instead of) the window
# above — the plain validation window is mostly stratiform/quiet, and the
# leaderboard needs a few days that actually stress the model (convective
# initiation, fast-moving fronts, embedded cells). Fill these in from the
# KNMI warning archive / gauge review; the entries below are placeholders.
# Case days are ALWAYS scored in full (never subsampled) and are also broken
# out as their own stratum (`results_case_days`) in the output, on top of
# being pooled into the headline `results`.
case_days:
  - "2026-06-15"  # TODO: candidate convective day — verify against KNMI warnings
  - "2026-07-22"  # TODO: candidate frontal passage — verify against KNMI warnings
  - "2026-08-10"  # TODO: candidate convective day — verify against KNMI warnings

# Deterministic seeded subsample of the eligible (issue, lead) pairs, capped
# per lead (max_samples // len(leads_min)) so no single lead can crowd out
# the others. Case-day samples don't count against this budget — see above.
max_samples: 2000
seed: 42

# 0 = score every grid cell; >0 = a seeded random subset of cells (re-picked
# per issue, so no single fixed cell set biases the run) used for the
# pointwise (categorical/continuous) metrics only — FSS always uses the full
# field, since it is inherently a neighbourhood score.
sample_cells: 0

thresholds_mm_h: [0.1, 0.5, 1.0, 2.0, 5.0]
leads_min: [30, 60, 90, 120]

# Neighbourhood sizes (px) for the Fractions Skill Score. Must be odd — FSS
# neighbourhoods are centred on each cell. Boundary convention: constant-zero
# padding (scipy.ndimage.uniform_filter, cval=0.0), i.e. cells near the grid
# edge see a neighbourhood partly filled with "dry"; this also applies to any
# cell excluded from a sample's validity mask (outside the radar domain),
# which is filled dry in both the prediction and the observation before FSS
# is computed, so it never inflates either field's wet fraction.
fss_scales_px: [1, 3, 5]

# Block-bootstrap confidence intervals (3.6). Resamples issue-time BLOCKS
# (not individual samples) so within-block correlation (e.g. the same storm
# scored at several leads/case days) doesn't understate the interval — a
# plain iid bootstrap over samples would be too narrow. `n`/`ci` trade
# runtime for precision; `seed` makes a run byte-identical on rerun.
# `reference_model` is the baseline every other model gets a paired-
# difference CI against ("A beats B" as an interval, not a point estimate).
bootstrap:
  blocks_h: 6
  n: 1000
  ci: 0.9
  seed: 42
  reference_model: persistence

# Adequacy (3.6): a run is only as trustworthy as the number of actual rain
# events it saw. Defined in events, not raw sample count — count distinct
# issue-times whose own analysis field (t0, before any lead) has a domain
# max above `threshold_mm_h`; below `min_events` the run is flagged
# `adequate: false` in metadata rather than silently reported at face value.
adequacy:
  threshold_mm_h: 5.0
  min_events: 30
