# pluvio backend deploy vars. No secrets — all PLUVIO_* config is public
# (KMI is an open endpoint), so no vault is needed.
---
app_dir: /opt/pluvio-backend
# Validate-first: deploy under a temp host, verify, then move pluvio.appmire.be
# DNS here and re-run `site.yml --tags nginx`.
pluvio_domain: pluvio.appmire.be
certbot_email: jeroen.trappers@secutec.com
enable_tls: true

# api binds 127.0.0.1:8000 (compose default profile); nginx is the public entry.
# Traefik (compose `prod` profile) is intentionally NOT used here.
api_loopback_port: 8000

# PWA (web) container — built from ../web by the same compose. nginx serves it
# at / while the API stays same-origin under /v1, /healthz, /docs (so no CORS).
# web_dir must be app_dir's sibling named `web` so the compose build context
# `../web` resolves both locally (backend/ ↔ web/) and on the box
# (/opt/pluvio-backend → /opt/web).
web_dir: /opt/web
web_loopback_port: 8001
pluvio_web_api_base: https://pluvio.appmire.be
pluvio_web_tiles_url: https://tiles.appmire.be
# tiles_api_key is NOT here: this repo is public. It lives in the gitignored
# deploy/ansible/secrets.yml (see secrets.yml.example).

# .env contents rendered onto the box (see roles/app/templates/env.j2).
pluvio_env:
  PLUVIO_CACHE_ROOT: /data/forecasts
  PLUVIO_KMI_BASE_URL: https://app.meteo.be/services/appv4/
  PLUVIO_CACHE_STALE_AFTER_SECONDS: "900"
  PLUVIO_API_HOST: 0.0.0.0
  PLUVIO_API_PORT: "8000"
  # The trained UNet is served via the precomputed field written by the hetz1
  # inference step (research/model/infer_latest.py → /opt/pluvio/serve). The
  # worker's model_band reads it and falls back to the KMI stub if missing/stale.
  PLUVIO_MODEL_VERSION: unet-0.1
  PLUVIO_CORS_ORIGINS: ""
