# pluvio backend deploy vars. No secrets — all PLUVIO_* config is public
# (KMI is an open endpoint), so no vault is needed.
---
app_dir: /opt/pluvio-backend
# Validate-first: deploy under a temp host, verify, then move pluvio.appmire.be
# DNS here and re-run `site.yml --tags nginx`.
pluvio_domain: pluvio.appmire.be
certbot_email: jeroen.trappers@secutec.com
enable_tls: true

# api binds 127.0.0.1:8000 (compose default profile); nginx is the public entry.
# Traefik (compose `prod` profile) is intentionally NOT used here.
api_loopback_port: 8000

# PWA (web) container — built from ../web by the same compose. nginx serves it
# at / while the API stays same-origin under /v1, /healthz, /docs (so no CORS).
# web_dir must be app_dir's sibling named `web` so the compose build context
# `../web` resolves both locally (backend/ ↔ web/) and on the box
# (/opt/pluvio-backend → /opt/web).
web_dir: /opt/web
web_loopback_port: 8001
pluvio_web_api_base: https://pluvio.appmire.be
pluvio_web_tiles_url: https://tiles.appmire.be
# tiles_api_key is NOT here: this repo is public. It lives in the gitignored
# deploy/ansible/secrets.yml (see secrets.yml.example).

# OPERA radar truth collection (research data → Storage Box). The collector
# windowed-crops the EUMETNET OPERA composite COGs onto our BeNeLux+context
# domain (open, anonymous, CC-BY-4.0). RATE = instantaneous rain rate, ACRR =
# 1-h accumulation; both carry a quality band.
opera_app_dir: /opt/opera
opera_data_dir: /mnt/storagebox/opera
opera_products: "RATE,ACRR"
opera_min_free_gb: 50          # stop collecting if the Storage Box drops below this
# Matches the trainable window: KNMI radar history + operational nowcast + rtcor
# truth (the channels the current correction model is paired to) only go back to
# 2024-08-14. Earlier OPERA has no matching inputs, so collecting it is wasted.
opera_backfill_start: "2024-08-14"

# AIFS NWP context collection (ECMWF open data → Storage Box). Forward-only:
# open-data keeps only the last few days. Deterministic single model; the
# ensemble (aifs-ens) is heavy and left as an on-demand manual run.
aifs_app_dir: /opt/aifs
aifs_data_dir: /mnt/storagebox/aifs
aifs_model: aifs-single
aifs_param: tp
aifs_max_step: 240
aifs_step: 6

# MTG Lightning Imager collection (EUMETSAT Data Store → Storage Box). Forward
# only by default (LI L2 history is short). Creds in secrets.yml (gitignored).
mtg_li_app_dir: /opt/mtg-li
mtg_li_data_dir: /mnt/storagebox/mtg_li
mtg_li_env_file: /opt/mtg-li/eumdac.env
mtg_li_products: "AF"
# LI lands every ~10 min at ~2-7 min lag; the old 15-min scan was slower than the
# data arrived. 5 min bounds the wait (collector skips what is already on disk).
mtg_li_interval_min: 5
mtg_li_min_free_gb: 50

# ERA5 reanalysis (public ARCO-ERA5 Zarr on GCS → Storage Box). The decades-deep
# NWP field set used to PRETRAIN the seamless model's outlook/downscaling head
# (AIFS open-data can't be backfilled — only ~4 days are kept — so ERA5 stands in
# as the historical NWP proxy, paired with the long OPERA archive as truth).
# Source is anonymous/public (gs://gcp-public-data-arco-era5), so NO credentials.
# Detached multi-year backfill + monthly catch-up.
era5_app_dir: /opt/era5
era5_data_dir: /mnt/storagebox/era5
era5_start: "2018-01"                 # first month of the backfill (YYYY-MM)
era5_variables: "total_precipitation,convective_available_potential_energy,total_column_water_vapour,2m_temperature,mean_sea_level_pressure,10m_u_component_of_wind,10m_v_component_of_wind"
era5_area: "58,-6,46,16"              # N,W,S,E — BeNeLux + synoptic context
era5_min_free_gb: 50

# MTG-FCI Level-2 gridded products (convective-precursor channels) via satpy.
# Same EUMDAC creds. GII=instability+moisture, CTTH=cloud-top, OCA=cloud
# microphysics, CT=cloud type/phase, OLR=outgoing longwave.
mtg_l2_app_dir: /opt/mtg-l2
mtg_l2_data_dir: /mnt/storagebox/mtg_l2
mtg_l2_env_file: /opt/mtg-l2/eumdac.env
mtg_l2_products: "GII,CTTH,OCA,CT,OLR"
mtg_l2_min_free_gb: 50

# Classical seamless-forecast producer (rec #4). Builds an image from the
# research model code and schedules a timer that writes model_forecast.npz to the
# serve dir the backend worker reads — so the product serves a source-tagged,
# confidence-banded forecast (pysteps optical-flow nowcast ⊕ AIFS outlook) with
# no dependence on the GPU-trained model. The learned model is a gated upgrade
# (produce_forecast.py --producer model), not wired here.
producer_app_dir: /opt/pluvio-producer
producer_serve_dir: /opt/pluvio/serve        # mounted into the worker (compose)
producer_storage_dir: /mnt/storagebox        # OPERA (+AIFS) input, read-only
producer_interval_min: 5                       # refresh cadence (picks up new OPERA promptly)
producer_max_age_min: 90
# Analysis-grid resolution for the producer. 256 = ~2.8 km, matching research and
# the c17-C checkpoints; the previous unset default (100x100, ~7-8 km) smeared
# convective peaks by ~4x before they reached the served grid.
producer_grid_n: 256
producer_zarr_dir: /opt/pluvio/zarr          # rolling live store for the model path
producer_model_checkpoint: nowcast_mm_c17_c_exceed.pt
producer_live_window_hours: 30
producer_li_max_age_min: 60                       # skip if the latest OPERA is staler

# .env contents rendered onto the box (see roles/app/templates/env.j2).
pluvio_env:
  PLUVIO_CACHE_ROOT: /data/forecasts
  PLUVIO_KMI_BASE_URL: https://app.meteo.be/services/appv4/
  # 45 min — the forecast issue time is the OPERA analysis time, which lags
  # wall-clock by radar cadence + collection + producer latency (observed worst
  # case ~40 min). Above this = collection broken, not normal OPERA lag.
  PLUVIO_CACHE_STALE_AFTER_SECONDS: "2700"
  PLUVIO_API_HOST: 0.0.0.0
  PLUVIO_API_PORT: "8000"
  # Provenance string the API reports. Stale values here are actively misleading:
  # it still read `unet-0.1` (the 2026-05 nowcast-only UNet served via
  # infer_latest.py) while the producer had moved on to the c17-C hybrid.
  #
  # c17c-hybrid-0.1 = nowcast_mm_c17_c_exceed.pt on leads 0-120 min (12ch: 6 radar
  # history + li_flash + oflow_rate + rate_tendency + 3 static; exceedance-pooled
  # structure loss) spliced into the classical pysteps⊕AIFS cube for 3-240 h. First
  # checkpoint to pass the roadmap promotion gate: beats real pysteps on MAE,
  # CSI@0.1, CSI@1 and FSS at 3/9/15 km at all 12 served leads (gpu_results/
  # c17_20260822/DELTA_c17.md). Bump this whenever the served producer changes.
  PLUVIO_MODEL_VERSION: c17c-hybrid-0.1
  PLUVIO_CORS_ORIGINS: ""
