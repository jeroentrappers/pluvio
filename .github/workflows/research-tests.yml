name: research-tests

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "backend/src/pluvio_backend/morph.py"
      - ".github/workflows/research-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - "backend/src/pluvio_backend/morph.py"
      - ".github/workflows/research-tests.yml"

concurrency:
  group: research-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r research/requirements-dev.txt

      - name: Pytest
        run: pytest research/tests -q
